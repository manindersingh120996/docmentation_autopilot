version: '3.8'

# Docker Compose confdiguration for local development infrastructure
# Run with : docker-compose up -d
# Stop with : docker-compose down
# View logs: docker-compose logs -f <service-name>


services:
  # ===========================================================================
  # PostgreSQL - Relational database for operational state
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: docautopilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: docautopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrations/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docautopilot

  # ===========================================================================
  # Neo4j - Graph database for documentation dependencies
  # ===========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: docautopilot-neo4j
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_PLUGINS: '["apoc"]' # APOC library for advanced graph algorithm
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
    ports:
      - "7474:7474" # HTTP (Neo4j Browswer UI)
      - "7687:7687" # Bolt Protocol
    healthcheck:
      test: ["CMD-SHELL","cypher-shell -u neo4j -p devpassword 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docautopilot


  # ===========================================================================
  # RabbitMQ - Message queue for event bus
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: docautopilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docautopilot

  # ===========================================================================
  # Redis - Cache for LLM responses and session data
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: docautopilot-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docautopilot

  # ===========================================================================
  # MinIO - S3-compatible object storage
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: docautopilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docautopilot

  # ===========================================================================
  # ChromaDB - Vector database for semantic search (optional)
  # Uncomment if you want ChromaDB as a server instead of in-process
  # ===========================================================================
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: docautopilot-chromadb
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chromadb_data:/chroma/chroma
  #   environment:
  #     IS_PERSISTENT: "TRUE"
  #     PERSIST_DIRECTORY: "/chroma/chroma"
  #   networks:
  #     - docautopilot

# ===========================================================================
# Volumes - Persistent data storage
# ===========================================================================
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
  redis_data:
  minio_data:
  # chromadb_data:

# ===========================================================================
# Networks - Isolated network for service communication
# ===========================================================================
networks:
  docautopilot:
    driver: bridge